name: Cypress Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  cypress:
    name: Cypress Chrome Dev Headed
    runs-on: ubuntu-latest

    container:
      image: cypress/browsers:node-20.9.0-chrome-118.0.5993.88-1-ff-118.0.2-edge-118.0.2088.46-1

    defaults:
      run:
        working-directory: cypress-example

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm run cypress:run:chrome:dev:headed

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: |
            cypress-example/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: |
            cypress-example/cypress/videos
          retention-days: 7